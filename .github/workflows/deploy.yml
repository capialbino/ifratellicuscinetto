name: Deploy Astro site to GitHub Pages

permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  translate_and_covers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check translation API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate-articles.mjs --check

      - name: Auto-translate Italian articles to English
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/translate-articles.mjs

      - name: Auto-generate technical SVG article covers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-covers.mjs

      - name: Commit generated translations and covers
        run: |
          if [ -n "$(git status --porcelain src/content/articles/en public/covers)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/articles/en public/covers
            git commit -m "chore: traduzione automatica EN e cover SVG articoli"
            for attempt in 1 2; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                exit 1
              fi
              sleep 2
            done
          fi

  build:
    needs: translate_and_covers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Build Astro site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
